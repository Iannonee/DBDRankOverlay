<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>DBD Rank Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --red:#d7263d; --ink:#0e0e10; --paper:#f2f2f2; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:transparent; font-family:"Segoe UI",Arial,sans-serif; color:var(--paper); }
  #overlay { display:inline-flex; flex-direction:column; align-items:center; gap:10px; padding:12px; }
  #emblem { width:170px; height:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
  #emblem.iri { animation:shift 6s linear infinite; }
  @keyframes shift { to { filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)) hue-rotate(360deg); } }
  #pips { display:flex; gap:8px; height:16px; }
  .pip { width:14px; height:14px; transform:rotate(45deg); border:2px solid #555; background:rgba(0,0,0,.55); transition:background .25s,border-color .25s; }
  .pip.on { background:var(--c); border-color:var(--c); box-shadow:0 0 8px var(--c); }

  /* pannello: visibile solo con ?panel */
  #panel { display:none; font-size:14px; background:var(--ink); border:1px solid #2a2a2e; border-radius:8px; padding:14px; margin:12px; width:300px; }
  body.panel #panel { display:block; }
  body.panel { background:#18181b; }
  #panel h1 { font-size:15px; margin:0 0 10px; color:var(--red); }
  #panel .row { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  #panel button { flex:1; background:#222226; color:var(--paper); border:1px solid #3a3a40; border-radius:6px; padding:8px 6px; cursor:pointer; font:inherit; }
  #panel button:hover { border-color:var(--red); }
  #panel button:focus-visible { outline:2px solid var(--red); outline-offset:2px; }
  #panel button.active { background:var(--red); border-color:var(--red); }
  #linkBox { width:100%; background:#222226; color:var(--paper); border:1px solid #3a3a40; border-radius:6px; padding:7px; font:12px Consolas,monospace; margin-bottom:8px; }
  body.panel { display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; padding:8px; overflow:auto; }
  body.panel #overlay { padding:4px; }
  body.panel #emblem { width:110px; }
  body.panel #panel { margin:0; flex:1 1 260px; width:auto; max-width:340px; }
  #drop { border:2px dashed #3a3a40; border-radius:8px; padding:14px 8px; text-align:center; margin-bottom:8px; }
  #drop.over { border-color:var(--red); background:#1c1012; }
  #panel small { color:#9a9aa2; display:block; margin-top:8px; line-height:1.4; }
</style>
</head>
<body>

<div id="overlay">
  <svg id="emblem" viewBox="0 0 120 120" aria-label="Rank"></svg>
  <div id="pips"></div>
</div>

<div id="panel">
  <h1>Rank DBD</h1>
  <div class="row" id="tiers"></div>
  <div class="row" id="levels"></div>
  <div class="row">
    <button id="pipMinus">− Pip</button>
    <button id="pipPlus">+ Pip</button>
  </div>
  <div class="row">
    <button id="rankDown">▼ Rank</button>
    <button id="rankUp">▲ Rank</button>
  </div>
  <div id="drop">Trascina qui le icone dei rank<br><small>nome file con tier e numero (es. gold2.png). Senza nome riconoscibile vanno sul rank attuale.</small></div>
  <div class="row"><button id="clearIcons">Rimuovi icone</button></div>
  <div class="row"><button id="genSync">Genera codice sync</button></div>
  <small id="syncStatus">Sync spento (serve per usare il pannello da telefono).</small>
  <input id="linkBox" readonly placeholder="Link da usare in OBS" aria-label="Link">
  <div class="row">
    <button id="copyOverlay">Link overlay</button>
    <button id="copyPanel">Link pannello</button>
  </div>
  <small>Tasti: ↑ ↓ cambiano rank, ← → +/− pip (a pip pieni sale di rank).</small>
</div>

// stato: rank 0..19 (Ash IV → Iridescent I), pips 0..PIPS_PER_RANK
let state = { rank:0, pips:0 };
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

function load(initial) {
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
  // override da URL: ?rank=gold2&pips=3
  const r = initial ? params.get('rank') : null;
  if (r) {
    const m = r.toLowerCase().match(/^(ash|bronze|silver|gold|iridescent|iri)([1-4])$/);
    if (m) {
      const t = TIERS.findIndex(t => t.id === (m[1]==='iri' ? 'iridescent' : m[1]));
      state.rank = t*4 + (4 - parseInt(m[2],10));
    }
  }
  if (initial && params.has('pips')) state.pips = parseInt(params.get('pips'),10) || 0;
  state.rank = clamp(state.rank, 0, 19);
  state.pips = clamp(state.pips, 0, Math.max(0, pipSlots(state.rank)-1));
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} if (typeof snap === 'function') seen = snap(); }
function save() { saveLocal(); publish(); }

    ? `<image href="${img}" x="0" y="0" width="${g.w}" height="${g.h}"/>
       <text x="${g.cx}" y="${g.cy+38}" text-anchor="middle" font-family="Georgia,serif" font-weight="700"
             font-size="${numeral.length>2 ? 78 : 104}" fill="${t.a}" stroke="#000" stroke-width="3" paint-order="stroke">${numeral}</text>`
    : `<defs>
         <linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
           <stop offset="0" stop-color="${t.a}"/><stop offset="1" stop-color="${t.b}"/>
         </linearGradient>
       </defs>
       <polygon points="60,4 112,36 112,84 60,116 8,84 8,36" fill="#0e0e10" stroke="url(#${gid})" stroke-width="5" stroke-linejoin="round"/>
       <polygon points="60,16 100,41 100,79 60,104 20,79 20,41" fill="url(#${gid})" opacity=".18"/>
       <polygon points="60,16 100,41 100,79 60,104 20,79 20,41" fill="none" stroke="url(#${gid})" stroke-width="2"/>
       <path d="M60 26 L68 38 H52 Z" fill="url(#${gid})"/>
       <text x="60" y="80" text-anchor="middle" font-family="Georgia,serif" font-weight="700"
             font-size="${numeral.length>2 ? 30 : 38}" fill="url(#${gid})">${numeral}</text>`;
  return art;
}

function render() {
  const ti = Math.floor(state.rank/4), t = TIERS[ti];
  const numeral = ROMAN[3 - (state.rank%4)];
  const em = document.getElementById('emblem');
  const icons = Object.assign({}, DEFAULT_ICONS, ICON_IMAGES, loadIcons());
  const img = icons[t.id + (4 - (state.rank%4))] || icons[t.id] || '';
  em.setAttribute('viewBox', img ? `0 0 ${ICON_GEO.w} ${ICON_GEO.h}` : '0 0 120 120');
  em.innerHTML = emblemSVG(t, numeral, img);
  em.classList.toggle('iri', !img && t.id==='iridescent');

  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  for (let i=0; i<pipSlots(state.rank); i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (i < state.pips ? ' on' : '');
    p.style.setProperty('--c', t.a);
    pips.appendChild(p);
  }
  // pannello
  document.querySelectorAll('#tiers button').forEach((b,i)=>b.classList.toggle('active', i===ti));
  document.querySelectorAll('#levels button').forEach((b,i)=>b.classList.toggle('active', i===(state.rank%4)));
  document.title = `DBD – ${t.name} ${numeral} (${state.pips}/${pipSlots(state.rank)})`;
}

function set(patch) { Object.assign(state, patch); state.rank = clamp(state.rank,0,19); state.pips = clamp(state.pips,0,Math.max(0, pipSlots(state.rank)-1)); save(); render(); }

// +1 / -1 pip: a pip pieni sale di rank, a zero scende (ma mai sotto il primo livello del tier)
function changePips(d) {
  let r = state.rank, p = state.pips + d;
  if (p >= pipSlots(r) && pipSlots(r) > 0) { if (r < 19) { r++; p = 0; } else p = 0; }
  else if (p < 0) { if (r % 4 === 0) p = 0; else { r--; p = pipSlots(r) - 1; } }
  set({ rank:r, pips:p });
}

// costruzione pannello
const tiersEl = document.getElementById('tiers'), levelsEl = document.getElementById('levels');
TIERS.forEach((t,i) => {
  const b = document.createElement('button'); b.textContent = t.name;
  b.onclick = () => set({ rank: i*4 + (state.rank%4) });
  tiersEl.appendChild(b);
});
ROMAN.slice().reverse().forEach((r,i) => {          // IV, III, II, I
  const b = document.createElement('button'); b.textContent = r;
  b.onclick = () => set({ rank: Math.floor(state.rank/4)*4 + i });
  levelsEl.appendChild(b);
});
document.getElementById('pipPlus').onclick  = () => changePips(1);
document.getElementById('pipMinus').onclick = () => changePips(-1);
document.getElementById('rankUp').onclick   = () => set({ rank: state.rank+1, pips:0 });
document.getElementById('rankDown').onclick = () => set({ rank: state.rank-1, pips:0 });

// icone caricate via drag&drop (salvate nel browser)
const ICON_KEY = 'dbdIcons';
function loadIcons() { try { return JSON.parse(localStorage.getItem(ICON_KEY) || '{}'); } catch(e) { return {}; } }
const LV = { i:1, ii:2, iii:3, iv:4, '1':1, '2':2, '3':3, '4':4 };
function iconKey(name) {
  const m = name.toLowerCase().replace(/\.[^.]+$/, '').match(/(ash|bronze|silver|gold|iri(?:descent)?)[^a-z0-9]*(iv|iii|ii|i|[1-4])?(?![a-z])/);
  if (!m) return null;
  const tier = m[1].startsWith('iri') ? 'iridescent' : m[1];
  return m[2] ? tier + LV[m[2]] : tier;
}
function readFile(f) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }); }
const drop = document.getElementById('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', async e => {
  const icons = loadIcons();
  for (const f of e.dataTransfer.files) {
    if (!f.type.startsWith('image/')) continue;
    const key = iconKey(f.name) || (TIERS[Math.floor(state.rank/4)].id + (4 - (state.rank%4)));
    icons[key] = await readFile(f);
  }
  try { localStorage.setItem(ICON_KEY, JSON.stringify(icons)); } catch(err) { alert('Immagini troppo pesanti, riducile e riprova.'); }
  render();
});
document.getElementById('clearIcons').onclick = () => { try { localStorage.removeItem(ICON_KEY); } catch(e) {} render(); };

// ===== sync da telefono (via ntfy.sh) =====
// Il codice sync è il "nome stanza": chi ha lo stesso codice nell'URL condivide il rank.
const cleanCode = c => (c || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
let SYNC = cleanCode(params.get('sync'));
if (!SYNC) { try { SYNC = cleanCode(localStorage.getItem('dbdSync')); } catch(e) {} }
let es = null, pubTimer = null;
const syncStatus = document.getElementById('syncStatus');
function setStatus(t) { syncStatus.textContent = t; }

function publish() {
  if (!SYNC) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(() => {
    fetch(`${NTFY_SERVER}/${SYNC}`, { method:'POST', body: JSON.stringify({ rank:state.rank, pips:state.pips }) })
      .catch(() => setStatus('Sync: invio non riuscito, controlla la connessione.'));
  }, 150);
}
function applyRemote(text) {
  let m; try { m = JSON.parse(text); } catch(e) { return; }
  if (typeof m.rank !== 'number' || typeof m.pips !== 'number') return;
  const rank = clamp(Math.round(m.rank), 0, 19);
  const pips = clamp(Math.round(m.pips), 0, Math.max(0, pipSlots(rank)-1));
  if (rank === state.rank && pips === state.pips) return;
  state.rank = rank; state.pips = pips; saveLocal(); render();
}
function startSync() {
  if (es) { es.close(); es = null; }
  if (!SYNC) { setStatus('Sync spento (serve per usare il pannello da telefono).'); return; }
  setStatus('Sync: connessione…');
  // stato iniziale: ultimo messaggio salvato dal server
  fetch(`${NTFY_SERVER}/${SYNC}/json?poll=1&since=all`).then(r => r.text()).then(t => {
    const lines = t.trim().split('\n').filter(Boolean);
    for (let i = lines.length - 1; i >= 0; i--) {
      try { const m = JSON.parse(lines[i]); if (m.event === 'message') { applyRemote(m.message); break; } } catch(e) {}
    }
  }).catch(() => {});
  es = new EventSource(`${NTFY_SERVER}/${SYNC}/sse`);
  es.onopen = () => setStatus('Sync attivo ✓ codice: ' + SYNC);
  es.onerror = () => setStatus('Sync: offline, riprovo…');
  es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event === 'message') applyRemote(m.message); } catch(e) {} };
}
document.getElementById('genSync').onclick = () => {
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  SYNC = 'dbd-' + Array.from(a, b => (b % 36).toString(36)).join('');
  try { localStorage.setItem('dbdSync', SYNC); } catch(e) {}
  startSync(); publish();
  showLink(mkLink(true), document.getElementById('genSync'));
};

// link overlay / pannello (funziona anche su GitHub Pages)
const BASE = location.protocol === 'file:' ? location.href.split(/[?#]/)[0] : location.origin + location.pathname;
const linkBox = document.getElementById('linkBox');
function showLink(url, btn) {
  linkBox.value = url; linkBox.focus(); linkBox.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (!ok && navigator.clipboard) { navigator.clipboard.writeText(url).then(() => flash(btn), () => {}); return; }
  if (ok) flash(btn);
}
function flash(btn) { const t = btn.textContent; btn.textContent = 'Copiato ✓'; setTimeout(() => btn.textContent = t, 1200); }
function mkLink(panel) {
  const q = new URLSearchParams();
  if (panel) q.set('panel', '1');
  if (SYNC) q.set('sync', SYNC);
  return BASE + (q.toString() ? '?' + q : '');
}
document.getElementById('copyOverlay').onclick = e => showLink(mkLink(false), e.currentTarget);
document.getElementById('copyPanel').onclick   = e => showLink(mkLink(true), e.currentTarget);

// un drop fuori dalla zona non deve aprire/navigare l'immagine
['dragover','drop'].forEach(ev => addEventListener(ev, e => e.preventDefault()));

// tastiera
addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key==='ArrowUp')    set({ rank: state.rank+1, pips:0 });
  if (e.key==='ArrowDown')  set({ rank: state.rank-1, pips:0 });
  if (e.key==='ArrowRight') changePips(1);
  if (e.key==='ArrowLeft')  changePips(-1);
});

// sync tra pannello (dock) e overlay (browser source)
addEventListener('storage', e => { if (e.key===KEY || e.key===ICON_KEY) { load(); render(); } });

// rete di sicurezza: se l'evento 'storage' non arriva (alcuni browser integrati), controllo ogni secondo
const snap = () => { try { return (localStorage.getItem(KEY) || '') + '|' + (localStorage.getItem(ICON_KEY) || '').length; } catch(e) { return ''; } };
let seen = snap();
setInterval(() => { const n = snap(); if (n !== seen) { seen = n; load(); render(); } }, 1000);

load(true); render(); startSync();
</script>
</body>
